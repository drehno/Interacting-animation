<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Cross-Tab Animations</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #0a0a0a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        .info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #fff;
            font-size: clamp(10px, 2vw, 14px);
            background: rgba(0, 0, 0, 0.8);
            padding: clamp(8px, 2vw, 15px);
            border-radius: 6px;
            z-index: 10;
            backdrop-filter: blur(10px);
            max-width: min(350px, 45vw);
            transition: opacity 0.3s, transform 0.3s;
        }

        .info.minimized {
            opacity: 0.5;
            transform: scale(0.9);
        }

        .info:hover {
            opacity: 1 !important;
            transform: scale(1) !important;
        }

        .info h2 {
            margin-bottom: 8px;
            font-size: clamp(14px, 3vw, 18px);
            color: #4CAF50;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .info p {
            margin: 4px 0;
            opacity: 0.9;
            line-height: 1.4;
        }

        .info p.detail {
            font-size: clamp(9px, 1.8vw, 12px);
        }

        .info p strong {
            color: #00d4ff;
        }

        .tab-id {
            color: #4CAF50;
            font-weight: bold;
            font-size: clamp(9px, 1.8vw, 11px);
            font-family: monospace;
        }

        .active-tabs {
            color: #ff6b6b;
            font-weight: bold;
        }

        #controls {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            padding: clamp(8px, 2vw, 15px);
            border-radius: 6px;
            color: white;
            backdrop-filter: blur(10px);
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: clamp(100px, 15vw, 150px);
        }

        button {
            background: #4CAF50;
            border: none;
            color: white;
            padding: clamp(6px, 1.5vw, 10px) clamp(10px, 2vw, 16px);
            border-radius: 4px;
            cursor: pointer;
            font-size: clamp(10px, 2vw, 14px);
            width: 100%;
            transition: all 0.3s;
            white-space: nowrap;
        }

        button:hover {
            background: #45a049;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(76, 175, 80, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        /* Bottom info bar for very small screens */
        @media (max-width: 600px), (max-height: 400px) {
            .info {
                top: auto;
                bottom: 10px;
                left: 10px;
                right: 10px;
                max-width: none;
            }

            .info p.detail {
                display: none;
            }

            #controls {
                flex-direction: row;
                top: 10px;
                right: 10px;
                left: auto;
                width: auto;
                min-width: auto;
            }

            button {
                padding: 6px 10px;
                font-size: 11px;
            }
        }

        /* Extra small windows */
        @media (max-width: 400px) or (max-height: 300px) {
            .info h2 {
                font-size: 12px;
            }

            .info p {
                font-size: 10px;
            }

            #controls {
                padding: 6px;
                gap: 4px;
            }

            button {
                padding: 5px 8px;
                font-size: 10px;
            }
        }

        /* Large screens - more spacing */
        @media (min-width: 1200px) {
            .info {
                top: 20px;
                left: 20px;
                padding: 15px;
            }

            #controls {
                top: 20px;
                right: 20px;
                padding: 15px;
            }
        }

        /* Landscape mobile - compact horizontal layout */
        @media (max-height: 500px) and (orientation: landscape) {
            .info {
                max-width: 250px;
            }

            .info h2 {
                margin-bottom: 4px;
            }

            .info p {
                margin: 2px 0;
            }

            .info p.detail {
                display: none;
            }
        }

        /* Hide controls in very narrow windows to maximize space */
        @media (max-width: 300px) {
            #controls {
                opacity: 0.3;
            }

            #controls:hover {
                opacity: 1;
            }
        }

        /* Fade out UI after a delay */
        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0.3; }
        }

        .auto-fade {
            animation: fadeOut 3s ease-in-out 5s forwards;
        }

        .auto-fade:hover {
            animation: none;
            opacity: 1;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <div class="info auto-fade">
        <h2>🌊 Cross-Window</h2>
        <p>Windows: <span class="active-tabs" id="activeTabs">1</span> | ID: <span class="tab-id" id="tabId"></span></p>
        <p class="detail">Click and drag to create particles</p>
        <p class="detail"><strong>Open multiple WINDOWS side-by-side!</strong></p>
        <p class="detail">Particles flow between aligned windows</p>
    </div>

    <div id="controls" class="auto-fade">
        <button id="clearBtn">Clear</button>
        <button id="randomBtn">Burst</button>
    </div>

    <script src="animation.js"></script>
</body>
</html>
